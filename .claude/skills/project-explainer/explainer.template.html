<!doctype html>
<!-- The fixed explainer shell (AD-13). scripts/build-explainer.mjs fills the double-brace slots from public/explainer.json.
     Edit the data, not this page: every Project's explainer shares this one format. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · how it works</title>
<style>
  :root {
    --accent: {{ACCENT}};
    --bg: #f8fafc; --card: #ffffff; --ink: #0f172a; --muted: #475569; --line: #e2e8f0; --chip: #f1f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1120; --card: #111827; --ink: #e5e7eb; --muted: #94a3b8; --line: #1f2937; --chip: #1e293b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header, main { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 28px; padding-bottom: 8px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .tldr { margin: 0; color: var(--muted); max-width: 70ch; }
  .tldr b { color: var(--ink); }
  main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; padding-bottom: 32px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
  h2 { margin: 0 0 8px; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  #diagram { overflow-x: auto; }
  #diagram pre.mermaid { margin: 0; white-space: pre-wrap; font-size: .8rem; color: var(--muted); }
  #diagram svg { max-width: 100%; height: auto; }
  #diagram g.node { cursor: pointer; }
  #diagram g.node.on rect, #diagram g.node.on polygon, #diagram g.node.on circle, #diagram g.node.on path { stroke: var(--accent) !important; stroke-width: 3px !important; }
  .panel h3 { margin: 0 0 4px; font-size: 1.15rem; }
  .panel h4 { margin: 12px 0 2px; font-size: .75rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .panel p { margin: 0; }
  .panel + .panel { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
  .js .panel + .panel { margin-top: 0; padding-top: 0; border-top: 0; }
  .files { margin: 0; padding-left: 18px; }
  .files a { color: var(--accent); }
  code { background: var(--chip); padding: 1px 5px; border-radius: 4px; font-size: .85em; overflow-wrap: anywhere; }
  .stop { font-size: .7rem; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 1px 8px; vertical-align: middle; }
  #tour { grid-column: 1 / -1; }
  #tour ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .step button { all: unset; box-sizing: border-box; display: flex; gap: 12px; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  .step button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .step.on button { border-color: var(--accent); background: var(--chip); }
  .num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
  .t { display: grid; gap: 2px; min-width: 0; }
  .where { font-size: .8rem; color: var(--muted); }
  .say { color: var(--muted); }
  .nav { display: flex; gap: 8px; margin-top: 12px; }
  .nav button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .nav button:disabled { opacity: .5; cursor: default; }
  @media (max-width: 760px) { main { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<header>
  <h1>{{TITLE}}</h1>
  <p class="tldr"><b>TL;DR</b> {{SUMMARY}}</p>
</header>
<main>
  <section class="card" id="diagram" aria-label="Architecture diagram">
    <h2>Architecture <span class="hint">· click a box</span></h2>
    <pre class="mermaid">{{MERMAID}}</pre>
  </section>
  <section class="card" id="panels" aria-live="polite">
    <h2>Details</h2>
{{PANELS}}
  </section>
  <section class="card" id="tour" aria-label="Guided tour">
    <h2>Tour · the talk track, in order</h2>
    <ol>
{{TOUR}}
    </ol>
    <div class="nav"><button type="button" id="prev">Back</button><button type="button" id="next">Next</button></div>
  </section>
</main>
<script type="application/json" id="explainer-data">{{DATA}}</script>
<script>
  // Works from file:// and as a static asset: no fetch, no server. Without JS every panel shows in order.
  (function () {
    const data = JSON.parse(document.getElementById("explainer-data").textContent);
    document.documentElement.classList.add("js");
    const panels = [...document.querySelectorAll(".panel")];
    const steps = [...document.querySelectorAll(".step")];
    let at = -1;
    function show(node, step) {
      panels.forEach((p) => (p.hidden = p.dataset.node !== node));
      steps.forEach((s, i) => s.classList.toggle("on", i === step));
      document.querySelectorAll("#diagram g.node").forEach((g) => g.classList.toggle("on", g.dataset.explainerNode === node));
      at = step;
      document.getElementById("prev").disabled = at <= 0;
      document.getElementById("next").disabled = at >= steps.length - 1;
    }
    window.explainerShow = show;
    steps.forEach((s, i) => s.querySelector("button").addEventListener("click", () => show(s.dataset.node, i)));
    document.getElementById("prev").addEventListener("click", () => at > 0 && show(data.tour[at - 1], at - 1));
    document.getElementById("next").addEventListener("click", () => at < steps.length - 1 && show(data.tour[at + 1], at + 1));
    window.explainerNodes = data.nodes;
    show(data.tour[0], 0);
  })();
</script>
<script type="module">
  // Mermaid from a pinned CDN URL. If it cannot load (offline), the diagram source stays readable as text.
  import mermaid from "{{MERMAID_URL}}";
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: dark ? "dark" : "default" });
  await mermaid.run({ querySelector: "#diagram pre.mermaid" });
  const keys = window.explainerNodes;
  document.querySelectorAll("#diagram g.node").forEach((g) => {
    const key = g.dataset.id || (g.id.match(/flowchart-(n\d+)-\d+$/) || [])[1];
    const node = keys[key];
    if (!node) return;
    g.dataset.explainerNode = node;
    g.setAttribute("tabindex", "0");
    g.setAttribute("role", "button");
    const pick = () => {
      const step = [...document.querySelectorAll(".step")].findIndex((s) => s.dataset.node === node);
      window.explainerShow(node, step);
    };
    g.addEventListener("click", pick);
    g.addEventListener("keydown", (e) => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), pick()));
  });
  const on = document.querySelector(".step.on");
  if (on) window.explainerShow(on.dataset.node, Number(on.dataset.step) - 1);
</script>
</body>
</html>
